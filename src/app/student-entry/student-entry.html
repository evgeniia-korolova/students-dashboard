<div  class="form-wrapper">
    <mat-card style="width: fit-content">
        <form class="student-entry-form" [formGroup]="studentEntryForm">
            <div class="student-entry-form__form-row">
                Full Name
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group full-width">
                        <mat-label>Name</mat-label>
                        <input matInput type="text" name="name" formControlName="name" type="text" placeholder="Name">
                    </mat-form-field>
                </div>
            </div>
            <div class="student-entry-form__form-row">
                Origin
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>Country</mat-label>
                        <input matInput type="text" name="country" formControlName="country" type="text" placeholder="Country">
                    </mat-form-field>
                    <mat-form-field class="form-group">
                        <mat-label>State</mat-label>
                        <input matInput type="text" name="State" formControlName="state" type="text" placeholder="State">
                    </mat-form-field>
                </div>
            </div>
            
            <div class="student-entry-form__form-row">
                Course Name
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>Course Name</mat-label>
                        <input matInput type="text" name="courseName" formControlName="courseName"  type="text" placeholder="Course Name">
                    </mat-form-field>
                    <mat-form-field class="form-group">
                        <mat-label>Subjects</mat-label>
                        <input matInput type="text" name="subjects" formControlName="subjects" type="text" placeholder="Subject">
                    </mat-form-field>
                </div>
            </div>
            <div  class="student-entry-form__form-row">
                Birth Date
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field>
                        <mat-label>Birth Date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="birthDate" name="birthDate"  placeholder="Birth Date">
                        <mat-hint>MM/DD/YYYY</mat-hint>
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>
            <div class="student-entry-form__form-row">
                Present Address
                <div class="student-entry-form__form-row--input-address">
                    <mat-form-field class="form-group">
                        <mat-label>Street Address</mat-label>
                        <input matInput  type="text" formControlName="street" placeholder="Street Address"/>
                    </mat-form-field>
                    <mat-form-field class="form-group">
                        <mat-label>Address 2</mat-label>
                        <input matInput  type="text" formControlName="address2" placeholder="Address 2"/>
                    </mat-form-field>
                    <mat-form-field class="form-group">
                        <mat-label>Email Address</mat-label>
                        <input matInput  type="text" formControlName="email" placeholder="Email"/>
                    </mat-form-field>
                </div>
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <mat-label>State</mat-label>
                        <input matInput  class="field-mat-label" formControlName="state"  type="text"/>
                    </mat-form-field>
                    <mat-form-field class="form-group">
                        <mat-label>City</mat-label>
                        <input matInput formControlName="city"  type="text"/>
                    </mat-form-field>
                </div>
                <div class="student-entry-form__form-row--input-section">
                    <mat-form-field class="form-group">
                        <label>Postal Code</label>
                        <input matInput formControlName="zip"  placeholder="Postal code"/>
                    </mat-form-field>
                    <mat-form-field class="form-group">
                        <label>Country</label>
                        <input matInput  class="field-label" formControlName="country" placeholder="country" >
                    </mat-form-field>
                </div>
                <div class="student-entry-form__form-row--input-buttons">
                    <button type="submit" color="primary"  mat-button>Submit</button>
                    <button type="submit" color="accent" mat-button>Cancel</button>
                </div>
            </div>
        </form>
    </mat-card>
</div>
