<mat-toolbar>
  <button matIconButton>
    <mat-icon>menu</mat-icon>
  </button>
  <h1>Students Dashboard</h1>
  <button matIconButton class="mode" (click)="darkMode.set(!darkMode())">
    @if (darkMode()) {
    <mat-icon>dark_mode</mat-icon>
    }@else {
    <mat-icon>light_mode</mat-icon>
    }
  </button>
</mat-toolbar>
